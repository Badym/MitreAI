[project]
name = "mitreai-backend"
version = "0.1.0"
description = "Backend MitreAI: API czatu mapującego komponenty ICS na MITRE ATT&CK"
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.2.0",
    "email-validator>=2.4.0",
    "fastapi>=0.163.2",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
